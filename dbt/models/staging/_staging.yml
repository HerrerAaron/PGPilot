version: 2

models:
  - name: stg_trips
    description: "Standardized trip records with light derived fields (date, duration)."
    columns:
      - name: trip_id
        description: "Surrogate primary key for a trip."
        data_tests:
          - not_null
          - unique
      - name: pickup_datetime
        description: "Trip start timestamp."
        data_tests:
          - not_null
      - name: pickup_location_id
        description: "Foreign key into the taxi-zone lookup."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_zones')
                field: location_id
      - name: payment_type
        description: "Payment method code. 0 is a real value (Flex Fare trip), not a placeholder for missing data."
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]

  - name: stg_zones
    description: "Taxi-zone lookup: identifier to borough and zone name."
    columns:
      - name: location_id
        description: "Zone identifier."
        data_tests:
          - not_null
          - unique
