name: pgpilot

services:
  postgres:
    image: postgres:16 # use pg version 16
    container_name: taxidb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    container_name: taxidb-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    healthcheck:
      test: ["CMD-SHELL", "pgrep cron || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
